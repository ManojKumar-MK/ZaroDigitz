<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" width="1000" height="1400">
  <!-- Original Zaro Digitz sample: maroon wedding card with gold borders. Customer text is added on top. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E9C766"/><stop offset=".5" stop-color="#C9A032"/><stop offset="1" stop-color="#A9832A"/></linearGradient>
  </defs>
  <rect width="1000" height="1400" fill="#6B1A25"/>
  <rect x="40" y="40" width="920" height="1320" fill="none" stroke="url(#g)" stroke-width="6"/>
  <rect x="62" y="62" width="876" height="1276" fill="none" stroke="url(#g)" stroke-width="2"/>
  <!-- corner kolam -->
  <g fill="none" stroke="url(#g)" stroke-width="3">
    <path d="M62 170 C110 170 170 110 170 62 M62 130 C95 130 130 95 130 62"/>
    <path d="M938 170 C890 170 830 110 830 62 M938 130 C905 130 870 95 870 62"/>
    <path d="M62 1230 C110 1230 170 1290 170 1338 M62 1270 C95 1270 130 1305 130 1338"/>
    <path d="M938 1230 C890 1230 830 1290 830 1338 M938 1270 C905 1270 870 1305 870 1338"/>
  </g>
  <!-- kalash at the top -->
  <g fill="none" stroke="url(#g)" stroke-width="5" stroke-linecap="round" transform="translate(500 210)">
    <path d="M-46 36 C-70 36 -80 64 -64 88 C-48 110 48 110 64 88 C80 64 70 36 46 36"/>
    <path d="M-52 34 L52 34"/>
    <path d="M-30 32 C-36 0 36 0 30 32"/>
    <path d="M0 0 C-22 -26 -44 -26 -58 -20 M0 0 C22 -26 44 -26 58 -20 M0 0 C-6 -34 0 -54 6 -60"/>
  </g>
  <text x="500" y="380" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#E9C766" letter-spacing="2">திருமண அழைப்பிதழ்</text>
  <text x="500" y="420" text-anchor="middle" font-family="Georgia, serif" font-size="24" fill="#F3DFA2">Wedding Invitation</text>
  <!-- ampersand between the names -->
  <text x="500" y="760" text-anchor="middle" font-family="Georgia, serif" font-size="70" fill="#C9A032">&amp;</text>
  <path d="M300 1010 L700 1010" stroke="url(#g)" stroke-width="2"/>
  <circle cx="500" cy="1010" r="7" fill="#C9A032"/>
</svg>
