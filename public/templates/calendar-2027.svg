<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1000" width="1400" height="1000">
  <!-- Original Zaro Digitz sample: 2027 desk calendar page (January). Company name and phone are added on top. -->
  <rect width="1400" height="1000" fill="#FBF5EC"/>
  <rect width="1400" height="70" fill="#7A1F2B"/>
  <g fill="#211114" opacity=".75">
    <rect x="230" y="18" width="18" height="34" rx="9"/><rect x="420" y="18" width="18" height="34" rx="9"/><rect x="610" y="18" width="18" height="34" rx="9"/>
    <rect x="790" y="18" width="18" height="34" rx="9"/><rect x="980" y="18" width="18" height="34" rx="9"/><rect x="1170" y="18" width="18" height="34" rx="9"/>
  </g>
  <text x="90" y="200" font-family="Georgia, serif" font-size="120" font-weight="700" fill="#7A1F2B">2027</text>
  <text x="96" y="262" font-family="Arial, sans-serif" font-size="40" fill="#211114">January</text>
  <g font-family="Arial, sans-serif" font-size="30" fill="#211114" text-anchor="middle">
    <g fill="#7A1F2B" font-weight="700">
      <text x="560" y="150">Sun</text><text x="680" y="150">Mon</text><text x="800" y="150">Tue</text><text x="920" y="150">Wed</text><text x="1040" y="150">Thu</text><text x="1160" y="150">Fri</text><text x="1280" y="150">Sat</text>
    </g>
    <text x="1160" y="220">1</text><text x="1280" y="220">2</text>
    <text x="560" y="290">3</text><text x="680" y="290">4</text><text x="800" y="290">5</text><text x="920" y="290">6</text><text x="1040" y="290">7</text><text x="1160" y="290">8</text><text x="1280" y="290">9</text>
    <text x="560" y="360">10</text><text x="680" y="360">11</text><text x="800" y="360">12</text><text x="920" y="360">13</text><text x="1040" y="360">14</text><text x="1160" y="360">15</text><text x="1280" y="360">16</text>
    <text x="560" y="430">17</text><text x="680" y="430">18</text><text x="800" y="430">19</text><text x="920" y="430">20</text><text x="1040" y="430">21</text><text x="1160" y="430">22</text><text x="1280" y="430">23</text>
    <text x="560" y="500">24</text><text x="680" y="500">25</text><text x="800" y="500">26</text><text x="920" y="500">27</text><text x="1040" y="500">28</text><text x="1160" y="500">29</text><text x="1280" y="500">30</text>
    <text x="560" y="570">31</text>
  </g>
  <circle cx="1160" cy="210" r="30" fill="none" stroke="#C9A032" stroke-width="4"/>
  <!-- band where the company's name goes -->
  <rect y="700" width="1400" height="300" fill="#7A1F2B"/>
  <rect y="700" width="1400" height="8" fill="#C9A032"/>
</svg>
