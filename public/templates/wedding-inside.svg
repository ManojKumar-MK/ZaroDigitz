<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1400" width="1000" height="1400">
  <!-- Original Zaro Digitz sample: inside page of the wedding card. Wording, times, families and the venue QR are added on top. -->
  <rect width="1000" height="1400" fill="#FBF5EC"/>
  <rect x="40" y="40" width="920" height="1320" fill="none" stroke="#7A1F2B" stroke-width="5"/>
  <rect x="58" y="58" width="884" height="1284" fill="none" stroke="#C9A032" stroke-width="2"/>
  <g fill="none" stroke="#C9A032" stroke-width="3">
    <path d="M58 150 C100 150 150 100 150 58"/><path d="M942 150 C900 150 850 100 850 58"/>
    <path d="M58 1250 C100 1250 150 1300 150 1342"/><path d="M942 1250 C900 1250 850 1300 850 1342"/>
  </g>
  <path d="M380 510 L620 510" stroke="#C9A032" stroke-width="2"/>
  <circle cx="500" cy="510" r="6" fill="#C9A032"/>
  <!-- frame for the venue QR -->
  <rect x="378" y="996" width="244" height="244" fill="#FFFFFF" stroke="#C9A032" stroke-width="3"/>
  <text x="500" y="1290" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#5A1420">Scan for directions to the venue</text>
</svg>
