<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <!-- Original Zaro Digitz product picture: New Year gift set - diary, desk calendar and pen in a box. -->
  <rect width="1000" height="1250" fill="#F1E8DC"/>
  <ellipse cx="500" cy="1030" rx="400" ry="40" fill="#000" opacity=".2"/>
  <!-- open box -->
  <rect x="110" y="420" width="780" height="600" rx="10" fill="#211114"/>
  <rect x="130" y="440" width="740" height="560" rx="6" fill="#7A1F2B"/>
  <path d="M130 440 L870 440 L870 470 L130 470 Z" fill="#C9A032" opacity=".85"/>
  <!-- diary -->
  <rect x="170" y="500" width="300" height="440" rx="10" fill="#211114"/>
  <text x="320" y="700" text-anchor="middle" font-family="Georgia, serif" font-size="64" font-weight="700" fill="#E9C766">2027</text>
  <text x="320" y="760" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#E9C766">SRI MURUGAN TRADERS</text>
  <!-- desk calendar -->
  <path d="M510 940 L560 560 L780 560 L830 940 Z" fill="#FBF5EC"/>
  <path d="M560 560 L780 560 L786 600 L554 600 Z" fill="#211114"/>
  <text x="670" y="690" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#7A1F2B">2027</text>
  <path d="M540 860 L800 860 L812 940 L528 940 Z" fill="#7A1F2B"/>
  <text x="670" y="912" text-anchor="middle" font-family="Georgia, serif" font-size="20" fill="#FFFFFF">Sri Murugan Traders</text>
  <!-- pen -->
  <rect x="490" y="500" width="22" height="430" rx="11" fill="#C9A032"/>
  <!-- ribbon on lid -->
  <rect x="200" y="180" width="600" height="190" rx="10" fill="#211114" transform="rotate(-6 500 275)"/>
  <rect x="480" y="160" width="40" height="230" fill="#C9A032" transform="rotate(-6 500 275)"/>
  <text x="960" y="1220" text-anchor="end" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#211114" opacity=".4">ZARO Digitz</text>
</svg>
