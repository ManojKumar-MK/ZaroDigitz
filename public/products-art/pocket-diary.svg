<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <!-- Original Zaro Digitz product picture: two A6 pocket diaries with a foil logo. -->
  <rect width="1000" height="1250" fill="#EDE5D8"/>
  <ellipse cx="520" cy="1000" rx="340" ry="36" fill="#000" opacity=".18"/>
  <g transform="rotate(-8 420 640)">
    <rect x="200" y="300" width="400" height="620" rx="16" fill="#1F4E79"/>
    <rect x="200" y="300" width="30" height="620" fill="#163a5c"/>
    <circle cx="415" cy="520" r="70" fill="none" stroke="#E9C766" stroke-width="5"/>
    <text x="415" y="535" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#E9C766">SM</text>
    <text x="415" y="680" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#E9C766">Sri Murugan Traders</text>
    <text x="415" y="860" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#F3DFA2">2027</text>
  </g>
  <g transform="rotate(6 640 660)">
    <rect x="460" y="340" width="400" height="620" rx="16" fill="#7A1F2B"/>
    <rect x="460" y="340" width="30" height="620" fill="#5A1420"/>
    <circle cx="675" cy="560" r="70" fill="none" stroke="#E9C766" stroke-width="5"/>
    <text x="675" y="575" text-anchor="middle" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#E9C766">SM</text>
    <text x="675" y="720" text-anchor="middle" font-family="Georgia, serif" font-size="30" fill="#E9C766">Sri Murugan Traders</text>
    <text x="675" y="900" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#F3DFA2">2027</text>
  </g>
  <text x="960" y="1220" text-anchor="end" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#211114" opacity=".4">ZARO Digitz</text>
</svg>
