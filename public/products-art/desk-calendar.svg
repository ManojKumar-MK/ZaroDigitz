<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1250" width="1000" height="1250">
  <!-- Original Zaro Digitz product picture: 2027 desk calendar on a table. -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4ECE1"/><stop offset="1" stop-color="#E9DDCC"/></linearGradient>
    <linearGradient id="desk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9A6A47"/><stop offset="1" stop-color="#7A4F33"/></linearGradient>
  </defs>
  <rect width="1000" height="1250" fill="url(#wall)"/>
  <rect y="820" width="1000" height="430" fill="url(#desk)"/>
  <ellipse cx="500" cy="905" rx="360" ry="34" fill="#000" opacity=".22"/>
  <!-- tent stand -->
  <path d="M170 900 L300 330 L700 330 L830 900 Z" fill="#E7DCCB"/>
  <!-- front page -->
  <path d="M190 890 L310 350 L690 350 L810 890 Z" fill="#FBF5EC"/>
  <path d="M310 350 L690 350 L700 400 L300 400 Z" fill="#7A1F2B"/>
  <g fill="#211114" opacity=".7"><circle cx="380" cy="350" r="9"/><circle cx="440" cy="350" r="9"/><circle cx="500" cy="350" r="9"/><circle cx="560" cy="350" r="9"/><circle cx="620" cy="350" r="9"/></g>
  <text x="500" y="480" text-anchor="middle" font-family="Georgia, serif" font-size="76" font-weight="700" fill="#7A1F2B">2027</text>
  <text x="500" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" fill="#211114">JANUARY</text>
  <g font-family="Arial, sans-serif" font-size="20" fill="#211114" text-anchor="middle">
    <text x="345" y="575">S</text><text x="400" y="575">M</text><text x="455" y="575">T</text><text x="510" y="575">W</text><text x="565" y="575">T</text><text x="620" y="575">F</text><text x="675" y="575">S</text>
    <text x="620" y="615">1</text><text x="675" y="615">2</text>
    <text x="345" y="650">3</text><text x="400" y="650">4</text><text x="455" y="650">5</text><text x="510" y="650">6</text><text x="565" y="650">7</text><text x="620" y="650">8</text><text x="675" y="650">9</text>
    <text x="345" y="685">10</text><text x="400" y="685">11</text><text x="455" y="685">12</text><text x="510" y="685">13</text><text x="565" y="685">14</text><text x="620" y="685">15</text><text x="675" y="685">16</text>
    <text x="345" y="720">17</text><text x="400" y="720">18</text><text x="455" y="720">19</text><text x="510" y="720">20</text><text x="565" y="720">21</text><text x="620" y="720">22</text><text x="675" y="720">23</text>
  </g>
  <path d="M232 760 L768 760 L800 890 L200 890 Z" fill="#7A1F2B"/>
  <text x="500" y="815" text-anchor="middle" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#FFFFFF">Sri Murugan Traders</text>
  <text x="500" y="855" text-anchor="middle" font-family="Arial, sans-serif" font-size="20" fill="#EAC96E">98765 43210 · Main Road, Sivakasi</text>
  <!-- plant and pen -->
  <rect x="820" y="760" width="90" height="110" rx="10" fill="#2E6B4F"/>
  <ellipse cx="865" cy="730" rx="70" ry="60" fill="#3F8A63"/>
  <rect x="90" y="950" width="210" height="14" rx="7" fill="#211114" transform="rotate(-12 195 957)"/>
  <!-- watermark -->
  <text x="960" y="1220" text-anchor="end" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#FFFFFF" opacity=".55">ZARO Digitz</text>
</svg>
